<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olive&amp;Co &middot; Market Intelligence</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F5F5F4;color:#1C1C1C;min-height:100vh}
.nav{display:flex;align-items:center;gap:8px;padding:10px 20px;background:#fff;border-bottom:1px solid #E8E8E8;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.logo{font-size:14px;font-weight:700;letter-spacing:.3px}
.logo b{color:#C0272D}
.nbtn{padding:6px 14px;font-size:12px;border-radius:8px;border:1px solid #E0E0E0;background:#fff;color:#555;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.nbtn:hover{border-color:#999;color:#1C1C1C}
.nbtn.cta{background:#C0272D;color:#fff;border-color:#C0272D;font-weight:700}
.nbtn.cta:hover{background:#A32D2D}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.br{background:#FCEBEB;color:#A32D2D}.ba{background:#FAEEDA;color:#854F0B}
.bg{background:#EAF3DE;color:#3B6D11}.bb{background:#E6F1FB;color:#185FA5}.bx{background:#F1EFE8;color:#5F5E5A}
.main{display:grid;grid-template-columns:1fr 360px;min-height:calc(100vh - 50px)}
@media(max-width:800px){.main{grid-template-columns:1fr}}
.left{padding:20px;border-right:1px solid #E8E8E8;overflow-y:auto;background:#fff}
.right{padding:20px;overflow-y:auto;background:#FAFAF9}
.stitle{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.srow{display:flex;align-items:flex-start;gap:8px;padding:9px 4px;border-bottom:1px solid #F0F0F0;cursor:pointer;border-radius:6px;transition:background .1s}
.srow:hover{background:#F8F8F8}.srow:last-child{border-bottom:none}
.cpill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px 4px 7px;border-radius:20px;border:1px solid #E0E0E0;font-size:12px;cursor:pointer;background:#fff;transition:all .15s;font-family:inherit}
.cpill:hover,.cpill.sel{background:#E6F1FB;border-color:#378ADD;color:#185FA5}
.card{background:#fff;border:1px solid #E8E8E8;border-radius:12px;padding:16px 18px;margin-bottom:14px}
.metric{background:#F5F5F4;border-radius:8px;padding:11px 14px}
.up{color:#3B6D11}.dn{color:#A32D2D}
.rbar{height:5px;background:#E8E8E8;border-radius:3px;margin:8px 0 16px}
.rbarin{height:5px;border-radius:3px}
.chip{display:inline-flex;padding:2px 7px;border-radius:4px;background:#F1EFE8;color:#5F5E5A;font-size:10px;font-weight:600;margin-right:3px;margin-bottom:3px}
.disc{padding:8px 12px;background:#FAEEDA;border-radius:8px;font-size:11px;color:#854F0B;margin-top:14px;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;display:inline-block}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo"><b>OLIVE</b>&Co &middot; Market Intelligence</div>
  <div style="flex:1"></div>
  <a href="sap-executive-cockpit.html" class="nbtn cta"><i class="ti ti-chart-bar" aria-hidden="true"></i> SAP Executive Cockpit &rarr;</a>
  <span class="badge bx" style="font-size:10px">Datos simulados</span>
</nav>
<div class="main">
  <div class="left" id="left"></div>
  <div class="right" id="right"></div>
</div>
<script>
var C={
  ES:{n:"Espana",f:"ES",r:"low",s:18,sig:[{l:"low",t:"Produccion campana 2024/25 normalizada; buen calibre manzanilla",src:"MAPA"},{l:"med",t:"Subida +8pct coste mano de obra recoleccion",src:"MAPA"},{l:"low",t:"Certificaciones BRC/IFS renovadas",src:"Interno"}],b:{v:38.4,m:22.1,cl:148,sk:"Manzanilla rellena 370ml",g:4.2,ch:"Retail 60pct - Export 25pct - FoodSvc 15pct"}},
  IT:{n:"Italia",f:"IT",r:"med",s:44,sig:[{l:"med",t:"Competencia aceituna italiana +12pct cuota",src:"IOC"},{l:"high",t:"Retailer principal renegocia condiciones Q3",src:"Interno"},{l:"low",t:"Importaciones UE +7.8pct sep-dic 2025",src:"CE"}],b:{v:9.2,m:18.4,cl:32,sk:"Negra sin hueso",g:-1.1,ch:"Retail 70pct - HoReCa 30pct"}},
  DE:{n:"Alemania",f:"DE",r:"low",s:22,sig:[{l:"low",t:"Consumo mediterraneo +5.3pct YoY",src:"Eurostat"},{l:"med",t:"PPWR packaging desde agosto 2026",src:"CE"},{l:"low",t:"Partner distribuidor consolidado (3 anos)",src:"Interno"}],b:{v:12.7,m:24.3,cl:19,sk:"Mix snack doypack 80g",g:9.1,ch:"Retail 55pct - Online 20pct - Deli 25pct"}},
  US:{n:"EE.UU.",f:"US",r:"high",s:78,sig:[{l:"high",t:"Aranceles antidumping: cuota ES 49pct (2017) a 19pct (2024)",src:"USITC 2024"},{l:"high",t:"Posicion comercial muy deteriorada vs. 2017",src:"MAPA"},{l:"med",t:"Competencia local Bell-Carter / Guadalquivir",src:"Publico"}],b:{v:4.1,m:11.2,cl:8,sk:"Verde rellena specialty",g:-18.4,ch:"Specialty retail 100pct"}},
  FR:{n:"Francia",f:"FR",r:"low",s:25,sig:[{l:"low",t:"Importaciones +6.1pct en 2025",src:"CE"},{l:"low",t:"Posicionamiento gourmet consolidado",src:"Interno"},{l:"med",t:"Margen distribuidor bajo presion",src:"Interno"}],b:{v:7.8,m:21.6,cl:28,sk:"Gordal alinada 500ml",g:3.4,ch:"Retail 50pct - Gourmet 30pct - HoReCa 20pct"}},
  MX:{n:"Mexico",f:"MX",r:"med",s:52,sig:[{l:"med",t:"Tipo de cambio MXN/EUR volatil +-12pct",src:"BCE"},{l:"high",t:"Logistica: retrasos aduana +3 semanas",src:"Interno"},{l:"med",t:"Competencia local creciente",src:"Estudio"}],b:{v:6.3,m:19.8,cl:14,sk:"Manzanilla sin hueso 200ml",g:1.2,ch:"Retail 80pct - FoodSvc 20pct"}},
  GB:{n:"UK",f:"UK",r:"med",s:38,sig:[{l:"med",t:"Post-Brexit: barreras arancelarias parciales",src:"HMRC"},{l:"low",t:"Mercado mediterraneo premium en alza",src:"ONS"},{l:"med",t:"GBP depreciacion -4pct vs. EUR",src:"BCE"}],b:{v:8.9,m:23.1,cl:22,sk:"Mix doypack premium 150g",g:6.7,ch:"Retail 45pct - Online 35pct - HoReCa 20pct"}},
  JP:{n:"Japon",f:"JP",r:"low",s:15,sig:[{l:"low",t:"EPA UE-Japon: reduccion arancelaria mejora ventas",src:"CE"},{l:"low",t:"Consumidor premium: apertura snacks mediterraneos",src:"Estudio"},{l:"low",t:"Distribucion con Mitsubishi Foods solida",src:"Interno"}],b:{v:3.2,m:28.4,cl:5,sk:"Nature doypack 150g",g:22.1,ch:"Premium retail 60pct - Ecomm 40pct"}},
  MA:{n:"Marruecos",f:"MA",r:"high",s:62,sig:[{l:"high",t:"Sequia severa campana 2024: produccion -25pct",src:"IOC"},{l:"med",t:"Competidor sourcing local +15pct",src:"IOC"},{l:"low",t:"JV potencial con aderezador local",src:"Estudio"}],b:{v:1.1,m:14.2,cl:3,sk:"Hojiblanca bulk",g:-5.1,ch:"B2B 100pct"}},
  AU:{n:"Australia",f:"AU",r:"low",s:20,sig:[{l:"low",t:"Consumo mediterraneo +8pct YoY",src:"ABARES"},{l:"low",t:"Tarifa 0pct Acuerdo EU-Australia 2023",src:"CE"},{l:"med",t:"Coste logistico alto: -3pp margen",src:"Interno"}],b:{v:2.4,m:25.1,cl:7,sk:"Mix snack premium 80g",g:14.2,ch:"Retail 70pct - Online 30pct"}},
};
var RC={high:"#E24B4A",med:"#EF9F27",low:"#639922"};
var RL={high:"Riesgo alto",med:"Riesgo medio",low:"Riesgo bajo"};
var FLAGS={ES:"&#127466;&#127480;",IT:"&#127470;&#127481;",DE:"&#127465;&#127466;",US:"&#127482;&#127480;",FR:"&#127467;&#127479;",MX:"&#127474;&#127485;",GB:"&#127468;&#127463;",JP:"&#127471;&#127477;",MA:"&#127474;&#127462;",AU:"&#127462;&#127482;"};
var sel="ES";

function rb(r){return '<span class="badge '+(r==="high"?"br":r==="med"?"ba":"bg")+'">'+RL[r]+'</span>';}
function sb(l){return '<span class="badge '+(l==="high"?"br":l==="med"?"ba":"bg")+'">'+(l==="high"?"&#9888; Alto":l==="med"?"&rarr; Medio":"&#10003; OK")+'</span>';}
function dc(r){return r==="high"?"style='background:#E24B4A'":r==="med"?"style='background:#EF9F27'":"style='background:#639922'";}

function renderL(){
  var all=Object.entries(C);
  var hi=all.filter(function(x){return x[1].r==="high";});
  var med=all.filter(function(x){return x[1].r==="med";});
  var lo=all.filter(function(x){return x[1].r==="low";});
  var h='<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><span style="font-size:15px;font-weight:700">Mercados activos</span><span class="badge bb">'+all.length+' paises</span></div>';
  h+='<div style="margin-bottom:18px"><div class="stitle">&#9888; Alertas criticas</div>';
  hi.forEach(function(x){var id=x[0],c=x[1];h+='<div class="srow" onclick="selC(''+id+'')"><span class="dot" style="background:#E24B4A"></span><div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><span style="font-size:16px">'+FLAGS[id]+'</span><span style="font-size:13px;font-weight:700">'+c.n+'</span><span style="font-size:12px;font-weight:700;color:#E24B4A">'+c.s+'</span></div><div style="font-size:11px;color:#888">'+c.sig[0].t.slice(0,55)+'...</div></div></div>';});
  h+='</div><div style="margin-bottom:18px"><div class="stitle">&rarr; En seguimiento</div>';
  med.forEach(function(x){var id=x[0],c=x[1];h+='<div class="srow" onclick="selC(''+id+'')"><span class="dot" style="background:#EF9F27"></span><div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px"><span style="font-size:16px">'+FLAGS[id]+'</span><span style="font-size:13px;font-weight:700">'+c.n+'</span><span style="font-size:12px;font-weight:700;color:#EF9F27">'+c.s+'</span></div><div style="font-size:11px;color:#888">'+c.sig[0].t.slice(0,55)+'...</div></div></div>';});
  h+='</div><div style="margin-bottom:18px"><div class="stitle">&#10003; Mercados estables</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
  lo.forEach(function(x){var id=x[0],c=x[1];h+='<button class="cpill'+(sel===id?" sel":"")+'" onclick="selC(''+id+'')"><span style="font-size:16px">'+FLAGS[id]+'</span>'+c.n+'<span class="badge bg" style="font-size:10px;margin-left:2px">'+c.s+'</span></button>';});
  h+='</div></div><div><div class="stitle">Fuentes activas</div><div>';
  ["IOC","MAPA","CE COMEXT","Eurostat","USITC","BCE","Interno"].forEach(function(s){h+='<span class="chip">'+s+'</span>';});
  h+='</div><div class="disc">Actualizacion periodica con fuentes oficiales &#8212; no tiempo real. Datos de negocio simulados para demo.</div></div>';
  document.getElementById("left").innerHTML=h;
}

function renderR(){
  var c=C[sel];
  var pos=c.b.g>=0;
  var h='<div style="margin-bottom:14px"><div style="font-size:20px;margin-bottom:5px"><span style="font-size:22px">'+FLAGS[sel]+'</span> <strong>'+c.n+'</strong> '+rb(c.r)+'</div>';
  h+='<div style="font-size:12px;color:#888">Indice de riesgo: <strong style="color:'+RC[c.r]+'">'+c.s+'</strong> / 100</div>';
  h+='<div class="rbar"><div class="rbarin" style="width:'+c.s+'%;background:'+RC[c.r]+'"></div></div></div>';
  h+='<div class="card"><div class="stitle">Senales de mercado</div>';
  c.sig.forEach(function(s){h+='<div style="padding:8px 0;border-bottom:1px solid #F0F0F0"><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">'+sb(s.l)+(s.src?'<span class="chip">'+s.src+'</span>':'')+'</div><div style="font-size:12px;color:#333;margin-top:2px;line-height:1.5">'+s.t+'</div></div>';});
  h+='</div><div class="card"><div class="stitle">Nuestro negocio en '+c.n+'</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">';
  h+='<div class="metric"><div style="font-size:11px;color:#888;margin-bottom:1px">Ventas &euro;M (sim.)</div><div style="font-size:22px;font-weight:700">'+c.b.v.toFixed(1)+'</div><div style="font-size:11px;margin-top:2px" class="'+(pos?"up":"dn")+'">'+(pos?"&#9650;":"&#9660;")+' '+Math.abs(c.b.g).toFixed(1)+'% YoY</div></div>';
  h+='<div class="metric"><div style="font-size:11px;color:#888;margin-bottom:1px">Margen bruto %</div><div style="font-size:22px;font-weight:700">'+c.b.m.toFixed(1)+'%</div><div style="font-size:11px;color:#888;margin-top:2px">Clientes: '+c.b.cl+'</div></div></div>';
  h+='<div style="font-size:12px;margin-bottom:5px">Top SKU: <strong>'+c.b.sk+'</strong></div>';
  h+='<div style="font-size:11px;color:#888;margin-bottom:14px">'+c.b.ch+'</div>';
  h+='</div>';
  h+='<a href="sap-executive-cockpit.html" class="nbtn cta" style="width:100%;justify-content:center;padding:12px;font-size:13px;margin-top:4px"><i class="ti ti-chart-bar" aria-hidden="true"></i> Abrir SAP Executive Cockpit &rarr;</a>';
  document.getElementById("right").innerHTML=h;
}

function selC(id){sel=id;renderL();renderR();}
window.selC=selC;
renderL();renderR();
</script>
</body>
</html>
